# Local stack for FS100 (plan.md D18). Run from the repo root (scripts/stack.mjs adds `.env` and `.env.local`):
# - Mode A, `pnpm stack:up`: infra only — Postgres, Qdrant, Keycloak, Phoenix, GitHub MCP server; apps run
#   with `pnpm dev`.
# - Mode B, `pnpm stack:up:full`: also web, api and ai-service as containers (`profiles: [full]`).
# Ports follow plan.md §5, identical in both modes, and are bound to 127.0.0.1 only.
# All images are multi-arch (amd64 + arm64). Every credential here is a dev-only default.
name: fs100

services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-change-me}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # TCP check on purpose: during first-run init Postgres only listens on the unix socket.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d postgres']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.2
    environment:
      QDRANT__TELEMETRY_DISABLED: 'true'
    ports:
      - '127.0.0.1:6333:6333' # REST + dashboard (/dashboard)
      - '127.0.0.1:6334:6334' # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # The image ships bash but no curl/wget.
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 &&
          printf "GET /readyz HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 &&
          head -n1 <&3 | grep -q " 200 "'
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    # Experimental, for Claude Code / VS Code at /mcp (ADR-0014). Never drop them: the realm's CIMD
    # policies then break every login, and a fresh import refuses to start.
    command: ['start-dev', '--import-realm', '--features=cimd,resource-indicators']
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-change-me}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-dev-only-change-me}
      # Fixed frontend URL => tokens always carry iss=http://localhost:8080/realms/kb,
      # also when a container reaches Keycloak as http://keycloak:8080 (Mode B).
      KC_HOSTNAME: http://localhost:8080
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      # Imported on startup only if the realm does not exist yet (see docs/setup/startup.md).
      - ../keycloak/realm-kb.json:/opt/keycloak/data/import/realm-kb.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Health endpoints live on the management port 9000 (not published). No curl in the image.
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf "GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 &&
          head -n1 <&3 | grep -q " 200 "'
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:version-20.24.0
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    ports:
      - '127.0.0.1:6006:6006' # UI + OTLP over HTTP (/v1/traces)
      - '127.0.0.1:4317:4317' # OTLP over gRPC (OTEL_EXPORTER_OTLP_ENDPOINT)
    volumes:
      - phoenix-data:/mnt/data
    healthcheck:
      # Distroless image: no shell, so probe with the bundled Python.
      test:
        - CMD
        - /usr/bin/python3.13
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006/healthz', timeout=3)
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # GitHub's MCP server for the agent's read-only `github.*` tools (D38, ADR-0010). In HTTP mode the AI
  # service sends the PAT (GITHUB_PAT_READ) with each request, so the container holds no secret. Server-side
  # read-only + lockdown; the allow-list lives in config/mcp_servers.yaml. Distroless: no healthcheck.
  github-mcp:
    image: ghcr.io/github/github-mcp-server:v2.0.2
    command:
      [
        http,
        --port,
        '8082',
        --read-only,
        --lockdown-mode,
        --toolsets,
        'repos,issues,pull_requests,actions',
      ]
    ports:
      - '127.0.0.1:8082:8082'
    restart: unless-stopped

  # --- Mode B: the apps. Stop `pnpm dev` first (same ports). A bare variable name passes the value from
  # the shell or `.env` and stays unset otherwise, so the app's default applies; `=` entries point the
  # apps at each other inside the Compose network.
  ai-service:
    profiles: [full]
    build:
      context: ../..
      dockerfile: apps/ai-service/Dockerfile
    environment:
      - AI_KEYCLOAK_ISSUER
      - AI_KEYCLOAK_AUDIENCE
      - AI_KEYCLOAK_CLIENT_ID
      - AI_KEYCLOAK_CLIENT_SECRET=${AI_KEYCLOAK_CLIENT_SECRET:-dev-only-change-me}
      - MCP_RESOURCE_URL
      - QDRANT_ALIAS
      - JOBS_INPROCESS_WORKER
      - EMBEDDING_MODEL
      - CHUNK_SIZE
      - CHUNK_OVERLAP
      - SPARSE_MODEL
      - RERANKER_MODEL
      - RERANK_CANDIDATES
      - RETRIEVAL_TOP_K
      - RETRIEVAL_SCORE_THRESHOLD
      - LLM_PROVIDER # unset = fake
      - LLM_BASE_URL
      - LLM_API_KEY
      - LLM_MODEL
      - LLM_MAX_OUTPUT_TOKENS
      - LLM_TIMEOUT_S
      - AGENT_MAX_STEPS
      - AGENT_MAX_PARALLEL_TOOLS
      - AGENT_TOOL_TIMEOUT_S
      - AGENT_RUN_TIMEOUT_S
      - AGENT_RUN_INPUT_TOKEN_BUDGET
      - AGENT_RUN_COST_CAP_USD
      - APPROVAL_SIGNING_KEY
      - APPROVAL_TTL_MIN
      - ROUTER
      - ROUTER_MODEL
      - GITHUB_REPO
      - GITHUB_SANDBOX_REPO
      - GITHUB_PAT_READ # from .env.local
      - GITHUB_PAT_SANDBOX_WRITE # from .env.local
      - WEB_FETCH_ALLOWED_HOSTS
      - OTEL_SERVICE_NAME
      - AI_KEYCLOAK_REALM_URL=http://keycloak:8080/realms/kb
      - QDRANT_URL=http://qdrant:6333
      - AI_DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-dev-only-change-me}@postgres:5432/ai
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://phoenix:4317
      - AI_API_URL=http://api:3000
      - GITHUB_MCP_URL=http://github-mcp:8082/mcp
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      # The first start downloads EMBEDDING_MODEL here (≈ 2.3 GB for bge-m3); later starts reuse it.
      - fastembed-cache:/app/.cache/fastembed
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      start_period: 15m
      start_interval: 5s
    restart: unless-stopped

  api:
    profiles: [full]
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      - LOG_LEVEL
      - KEYCLOAK_ISSUER
      - KEYCLOAK_AUDIENCE
      - KEYCLOAK_CLIENT_ID
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:-dev-only-change-me}
      - AI_SERVICE_AUDIENCE
      - INGEST_URL_ALLOWED_HOSTS
      - CORS_ORIGINS
      - UPLOAD_MAX_MB
      - CHAT_THROTTLE_PER_MIN
      - DAILY_COST_CAP_USD_VIEWER
      - DAILY_COST_CAP_USD_EDITOR
      - DAILY_COST_CAP_USD_ADMIN
      - API_DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-dev-only-change-me}@postgres:5432/app
      - KEYCLOAK_REALM_URL=http://keycloak:8080/realms/kb
      - AI_SERVICE_URL=http://ai-service:8000
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    profiles: [full]
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      - WEB_KEYCLOAK_URL
      - WEB_KEYCLOAK_REALM
      - WEB_KEYCLOAK_CLIENT_ID
      - WEB_API_BASE_URL
      - WEB_PHOENIX_URL
    ports:
      - '127.0.0.1:4200:8080'
    restart: unless-stopped

volumes:
  postgres-data:
  qdrant-data:
  phoenix-data:
  fastembed-cache:
