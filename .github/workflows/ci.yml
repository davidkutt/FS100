# Lint, test and build every app, check contract drift and the Compose file (plan.md D19).
# Siblings: eval.yml (retrieval eval, report only), e2e.yml (Playwright smoke), docker.yml (GHCR images).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: web + api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # setup-node would detect pnpm from package.json#packageManager and fail, because pnpm
          # is only installed by Corepack in the next step.
          package-manager-cache: false
      - name: Enable pnpm (version from package.json#packageManager)
        run: corepack enable pnpm && pnpm --version
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --recursive --filter "./apps/*" run lint && pnpm format:check
      - name: Test
        run: pnpm --recursive --filter "./apps/*" run test
      - name: Build
        run: pnpm build

  ai-service:
    name: ai-service
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/ai-service/uv.lock
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run pyright
      - name: Test
        run: uv run pytest

  contracts:
    name: contract drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: corepack enable pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/ai-service/uv.lock
      - run: pnpm install --frozen-lockfile && uv sync --locked --directory apps/ai-service
      - run: pnpm contracts:generate
      - name: Committed contracts match the code
        run: |
          if [ -n "$(git status --porcelain packages/contracts)" ]; then
            git diff packages/contracts
            echo "::error::packages/contracts is stale: run pnpm contracts:generate and commit the result"
            exit 1
          fi

  compose:
    name: compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: docker compose --file infra/compose/docker-compose.yml --profile full config --quiet
